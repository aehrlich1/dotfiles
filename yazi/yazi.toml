[mgr]
ratio = [1, 3, 4]
linemode = "size"
show_hidden = true
title_format = ""

[plugin]
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]

[opener]
editor = [
  { run = 'cd %s && $EDITOR .', block = true, desc = "$EDITOR" }
]
emacs = [
  { run = 'emacs -nw %s', block = true },
]
code = [
  { run = 'code %s', orphan = true },
]
visidata = [
  { run = 'visidata %s', block = true },
]


[open]
prepend_rules = [
  { url = "*.csv", use = ["visidata", "edit"] },
  { url = "*.org", use = "emacs" },
  { url = "*.svg", use = ["edit", "open"] },
]
append_rules = [
  { url = "*/", use = ["editor", "reveal", "code"] },
]

